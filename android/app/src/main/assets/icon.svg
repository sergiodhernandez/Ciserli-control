<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark background gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14121a" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    
    <!-- Metallic gold gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8D6E63" />
    </linearGradient>
    
    <!-- Soft glow filter for the moon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="8" />

  <!-- Stars -->
  <g fill="#FFE082" opacity="0.6">
    <!-- Star 1 -->
    <path d="M150 160 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" />
    <!-- Star 2 -->
    <path d="M360 120 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" />
    <!-- Star 3 -->
    <path d="M380 340 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" />
    <!-- Star 4 -->
    <path d="M130 320 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" />
  </g>

  <!-- Crescent Moon -->
  <path d="M256 120
           c15.84 0 31.56 2.52 47.04 7.56
           a128 128 0 0 0-95.04 195.84
           A128 128 0 1 1 256 120z" 
        fill="url(#gold-grad)" 
        filter="url(#glow)" 
        transform="translate(10, 0) scale(0.95) rotate(-5, 256, 256)" />

  <!-- Little decorative dots -->
  <circle cx="240" cy="180" r="2" fill="#FFF" opacity="0.8"/>
  <circle cx="310" cy="220" r="1.5" fill="#FFF" opacity="0.5"/>
  <circle cx="200" cy="280" r="2.5" fill="#FFE082" opacity="0.7"/>
  <circle cx="290" cy="300" r="1.5" fill="#FFF" opacity="0.9"/>
</svg>
